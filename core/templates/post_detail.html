{% extends "base.html" %}

{% block title %}Пост №{% endblock title %}

{% block extra_css %}
{% load static %}
    <link rel="stylesheet" href="{% static 'css/post_detail.css' %}">
{% endblock extra_css %}

{% block content %}
<h1>Пост № {{ post.id }}</h1>
<h2>{{ post.title }}</h2>
<p>{{ post.author }} -- {{ post.created_at }}</p>
<div class="post-text">{{ post.text }}</div>
<p><a href="{{ request.META.HTTP_REFERER|default:'/'}}">Назад</a></p>
{% endblock content %}
